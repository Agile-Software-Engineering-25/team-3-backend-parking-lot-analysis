name: Build and Deploy to MinIO

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          VITE_BACKEND_BASE_URL: ${{ https://sau-portal.de/}}

      - name: Setup MinIO Client
        run: |
          curl https://dl.min.io/aistor/mc/release/linux-amd64/mc \
            --create-dirs \
            -o $HOME/minio-binaries/mc
          chmod +x $HOME/minio-binaries/mc
          export PATH=$PATH:$HOME/minio-binaries/

      - name: Configure MinIO Client
        run: |
          $HOME/minio-binaries/mc alias set minio \
            ${{ https://minio.sau-portal.de }} \
            ${{  ase-03 }} \
            ${{ cOQC373EgeQ9GVnI9t9Ltv4Ri }}

      - name: Clear existing files in bucket
        run: |
          $HOME/minio-binaries/mc rm --recursive --force minio/${{ ase-03 }} || echo "No existing files to remove"

      - name: Upload dist files to MinIO
        run: |
          $HOME/minio-binaries/mc cp --recursive dist/ minio/${{ ase-03 }}

      - name: Set bucket to public (optional)
        run: |
          $HOME/minio-binaries/mc anonymous set public minio/${{ ase-03 }} || echo "Could not set public access - check permissions"

      - name: List uploaded files
        run: |
          echo "Files uploaded to MinIO:"
          $HOME/minio-binaries/mc ls --recursive minio/${{ ase-03 }}

      - name: Deploy Summary
        run: |
          echo "🚀 Deployment completed successfully!"
          echo "📦 Files uploaded from ./dist to minio/${{ase-03}} bucket"
          echo "🌐 Application should be available at your MinIO endpoint"

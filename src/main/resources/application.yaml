spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://keycloak.sau-portal.de/realms/sau
          jwk-set-uri: https://keycloak.sau-portal.de/realms/sau/protocol/openid-connect/certs
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  datasource:
    url: jdbc:postgresql://postgres.db:5432/appdb
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

server:
  port: 8080

error:
  include-message: always

# Spring Boot Actuator
management:
  endpoints:
    web:
      base-path: /api/parkingservice
      exposure:
        include: health,info,mappings
  endpoint:
    health:
      probes:
        enabled: true
